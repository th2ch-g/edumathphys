id: sets-logic
prefix: sets
title: 集合と論理
title_en: Sets and Logic
area: math
level: undergrad-basic
order: 10
description: >-
  大学数学を記述するための論理と集合の基礎。命題と量化子、証明の技法、集合演算、写像と集合族、同値関係と商集合、順序集合、
  整列集合と順序数、濃度とその演算、選択公理と Zorn の補題、自然数から実数・複素数に至る数の体系の構成を扱う。
references: [matsuzaka-sets, uchida-topology]
chapters:
  - id: logic
    title: 命題と論理
    status: reviewed
    sections: [命題と論理結合子, 真理値表とトートロジー, 論理的同値と標準形, 述語と量化子, 多重量化子とその否定, ε-δ 論法の論理構造]
  - id: proofs
    title: 証明の方法
    status: reviewed
    sections: [直接証明と場合分け, 対偶による証明, 背理法, 数学的帰納法と完全帰納法, 存在証明と構成的証明, 反例による否定]
  - id: sets
    title: 集合と集合演算
    status: reviewed
    sections: [集合の表し方と外延性, 包含関係と相等, 和集合・共通部分・差・補集合, De Morgan の法則と分配法則, 直積集合と冪集合, Russell の逆理と素朴集合論の限界]
  - id: maps
    title: 写像
    status: reviewed
    sections: [写像の定義とグラフ, 単射・全射・全単射, 合成写像と逆写像, 像と逆像, 制限と拡張, 写像全体の集合と特性関数]
  - id: families
    title: 集合族と一般の直積
    status: reviewed
    sections: [添字付けられた集合族, 集合族の和集合と共通部分, 集合族と像・逆像, 一般の直積集合と射影, 選択関数と直積の非空性]
  - id: relations
    title: 同値関係と商集合
    status: reviewed
    sections: [二項関係とその性質, 同値関係と同値類, 分割と同値関係の対応, 商集合と標準射影, 写像の標準分解, 整数の合同と ℤ/nℤ]
  - id: orders
    title: 順序集合
    status: reviewed
    sections: [半順序と全順序, Hasse 図と順序集合の例, 最大元・極大元・上限・下限, 順序を保つ写像と順序同型, 束と完備束, Knaster–Tarski の不動点定理]
  - id: ordinals
    title: 整列集合と順序数
    status: reviewed
    sections: [整列集合と切片, 超限帰納法, 整列集合の比較定理, 順序数と順序型, 順序数の大小と演算, 超限再帰による定義]
  - id: cardinality
    title: 濃度
    status: reviewed
    sections: [対等と濃度, 有限集合と無限集合, 可算集合, Bernstein の定理, 対角線論法と Cantor の定理, 連続体の濃度]
  - id: choice
    title: 選択公理と Zorn の補題
    status: reviewed
    sections: [選択公理とその言い換え, Zorn の補題, 整列可能定理, 三者の同値性の証明, 応用（ベクトル空間の基底と極大イデアルの存在）, 選択公理の必要性と非構成性]
  - id: cardinal-arithmetic
    title: 濃度の演算
    status: reviewed
    sections: [濃度の和・積・冪, 濃度の比較可能性, ℵ₀ と連続体濃度の計算, 始順序数と基数, 無限濃度 κ に対する κ·κ = κ, 連続体仮説]
  - id: natural-numbers
    title: 自然数・整数・有理数
    status: reviewed
    sections: [Peano の公理, 帰納法の原理と再帰的定義, 自然数の演算と順序, 整数の構成, 有理数の構成, 順序体と Archimedes 性]
  - id: number-systems
    title: 実数と複素数の構成
    status: reviewed
    sections: [Dedekind の切断による実数の構成, Cauchy 列による実数の構成, 二つの構成の同型性, 完備順序体の一意性, 実数の濃度, 複素数の構成と性質]

id: statistics
prefix: stat
title: 数理統計学
title_en: Mathematical Statistics
area: math
level: undergrad-advanced
order: 240
description: >-
  統計的推測の数理。標本分布、十分統計量、点推定と最尤法・Cramér–Rao の不等式、区間推定、仮説検定と Neyman–Pearson の補題、線形モデル、漸近理論、Bayes 推測を扱う。
prerequisites: [probability, linear-algebra]
references: [takeuchi-stat, casella-berger, lehmann-tpe]
chapters:
  - id: sampling
    title: 標本と標本分布
    sections: [母集団と標本, 正規分布と χ²・t・F 分布, 順序統計量]
  - id: sufficiency
    title: 十分統計量
    sections: [十分性, 因子分解定理, 完備性, 指数型分布族]
  - id: point-estimation
    title: 点推定
    sections: [不偏推定量, Cramér–Rao の不等式, Rao–Blackwell の定理, 最尤推定量]
  - id: interval-estimation
    title: 区間推定
    sections: [信頼区間, 枢軸量, 漸近的信頼区間]
  - id: hypothesis-testing
    title: 仮説検定
    sections: [検定の枠組み, Neyman–Pearson の補題, 一様最強力検定, 尤度比検定]
  - id: linear-models
    title: 線形モデル
    sections: [最小二乗法, Gauss–Markov の定理, 分散分析]
  - id: asymptotics
    title: 漸近理論
    sections: [一致性, 漸近正規性, Fisher 情報量と有効性]
  - id: bayesian
    title: Bayes 推測
    sections: [事前分布と事後分布, 共役事前分布, Bayes 推定量, 階層モデル]

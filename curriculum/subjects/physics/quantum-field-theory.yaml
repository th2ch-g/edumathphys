id: quantum-field-theory
prefix: qft
title: 場の量子論
title_en: Quantum Field Theory
area: physics
level: graduate
order: 140
description: >-
  古典場の理論と自由場の正準量子化、相互作用と摂動論・Feynman 則、量子電磁力学の基本過程、経路積分による定式化、くりこみ、非可換ゲージ理論の量子化までを扱う。
prerequisites: [advanced-quantum-mechanics, special-relativity, electromagnetism]
conventions:
  - 自然単位系 ℏ = c = 1 を用いる。計量は η = diag(+1, −1, −1, −1)（素粒子物理の慣習）とし、相対論や一般相対論の章と符号が逆である点に注意する。
references: [peskin-schroeder, srednicki-qft, weinberg-qft1, schwartz-qft]
chapters:
  - id: classical-fields
    title: 古典場の理論
    sections: [場の作用と Euler–Lagrange 方程式, Noether の定理と保存カレント, Lorentz 対称性, スカラー場・Dirac 場・電磁場の作用]
  - id: scalar-quantization
    title: スカラー場の正準量子化
    sections: [Klein–Gordon 場の量子化, Fock 空間と粒子解釈, 因果律, Feynman 伝播関数]
  - id: dirac-field
    title: Dirac 場の量子化
    sections: [Lorentz 群のスピノル表現, Dirac 場の量子化と反交換関係, スピンと統計, 離散対称性 C, P, T]
  - id: interacting-fields
    title: 相互作用と摂動論
    sections: [相互作用描像と Dyson 級数, Wick の定理, Feynman ダイアグラム, S 行列と断面積, LSZ 簡約公式]
  - id: qed
    title: 量子電磁力学
    sections: [電磁場の量子化とゲージ固定, QED の Feynman 則, 基本過程（e⁺e⁻→μ⁺μ⁻・Compton 散乱）, Ward 恒等式]
  - id: path-integral
    title: 経路積分による定式化
    sections: [場の経路積分, 生成汎関数, Grassmann 数とフェルミオンの経路積分, 有効作用]
  - id: renormalization
    title: くりこみ
    sections: [1 ループ発散と正則化, くりこみ可能性と次元解析, φ⁴ 理論のくりこみ, くりこみ群方程式とランニング結合定数, QED の 1 ループ補正]
  - id: gauge-theories
    title: 非可換ゲージ理論
    sections: [Yang–Mills 理論, Faddeev–Popov の方法とゴースト, BRST 対称性, 漸近的自由性]
  - id: symmetry-breaking
    title: 対称性の自発的破れ
    sections: [自発的対称性の破れと Goldstone の定理, Higgs 機構, 有効ポテンシャル]

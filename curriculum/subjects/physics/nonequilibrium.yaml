id: nonequilibrium
prefix: neq
title: 非平衡統計力学
title_en: Nonequilibrium Statistical Mechanics
area: physics
level: graduate
order: 160
description: >-
  Brown 運動と Langevin 方程式、Fokker–Planck 方程式、線形応答理論と揺動散逸定理、Boltzmann 方程式と H 定理、Onsager の相反定理、ゆらぎの定理と確率熱力学を扱う。
prerequisites: [statistical-mechanics, probability]
references: [kubo-toda-hashitsume, zwanzig-noneq, sekimoto-stochastic]
chapters:
  - id: brownian-motion
    title: Brown 運動と Langevin 方程式
    sections: [Einstein の関係, Langevin 方程式, 揺動散逸関係, 相関関数]
  - id: fokker-planck
    title: Fokker–Planck 方程式
    sections: [Markov 過程とマスター方程式, Fokker–Planck 方程式の導出, 定常解と緩和, Kramers の脱出率]
  - id: linear-response
    title: 線形応答理論
    sections: [応答関数と感受率, 久保公式, 揺動散逸定理, Kramers–Kronig の関係]
  - id: boltzmann-equation
    title: Boltzmann 方程式
    sections: [Boltzmann 方程式の導出, H 定理, Chapman–Enskog 展開と輸送係数]
  - id: onsager
    title: 非平衡熱力学
    sections: [エントロピー生成, Onsager の相反定理, 熱電効果]
  - id: fluctuation-theorems
    title: ゆらぎの定理と確率熱力学
    sections: [確率熱力学, Jarzynski 等式, Crooks のゆらぎの定理, 情報熱力学入門]

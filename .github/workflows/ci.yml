name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v6
        with:
          path: .cache
          key: tikz-${{ hashFiles('src/content/**/*.md') }}
          restore-keys: tikz-
      - run: npm ci
      - run: npm run check
      - run: npm run build
